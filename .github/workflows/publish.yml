# Publish @lixiangzhong/dsh-active-chat to npm from a version tag.
#
# Authentication uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret is stored
# in this repository. The npm package must list this workflow as a trusted
# publisher before the first CI release:
#
#   npmjs.com → Packages → @lixiangzhong/dsh-active-chat → Settings → Trusted publishing
#     Provider:        GitHub Actions
#     User:            lixiangzhong
#     Repository:      dsh-active-chat
#     Workflow:        publish.yml
#     Allowed actions: enable "Allow npm publish"   (new configs default to stage-only)
#
# Release flow: bump version in package.json, commit, push, then push a `v<version>`
# tag (for example `git tag v0.1.1 && git push origin v0.1.1`). The tag job checks the
# tag against package.json, runs the package checks, and publishes with provenance.
name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token exchange required by Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing needs npm >= 11.5.1; the runner's bundled npm may lag.
      - name: Ensure a Trusted-Publishing-capable npm
        run: npm install --global npm@latest

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
          echo "releasing ${version}"

      - name: Run package checks
        run: npm test

      - name: Publish with provenance
        run: npm publish
